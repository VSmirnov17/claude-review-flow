name: review-flow

# Bug review, security review and risk classification for each pushed commit.
# Claude reads untrusted diffs, so the job that runs it has no permission to set
# commit statuses. A separate job validates its output and publishes the result.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    # Forks get no secrets. The gate requires a person for them instead.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      round: ${{ steps.round.outputs.round }}
      since: ${{ steps.round.outputs.since }}
      capped: ${{ steps.round.outputs.capped }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: round
        uses: actions/github-script@v7
        with:
          script: |
            const { prepareRound } = await import(`${process.env.GITHUB_WORKSPACE}/.github/review-flow/review-flow.mjs`);
            await prepareRound({ github, context, core });

  review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      classification: ${{ steps.classify.outputs.structured_output }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bug review
        if: needs.prepare.outputs.capped != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          plugin_marketplaces: https://github.com/__MARKETPLACE_REPO__.git
          plugins: review-flow@review-flow
          prompt: >-
            /review-flow:review ${{ vars.REVIEW_FLOW_MODE || 'standard' }} --post
            --pr=${{ github.event.pull_request.number }}
            --base=${{ github.event.pull_request.base.sha }}
            --head=${{ github.event.pull_request.head.sha }}
            --round=${{ needs.prepare.outputs.round }}
            --since=${{ needs.prepare.outputs.since }}
          claude_args: >-
            --allowedTools "Agent,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api graphql:*),mcp__github_inline_comment__create_inline_comment"

      - name: Security review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          plugin_marketplaces: https://github.com/__MARKETPLACE_REPO__.git
          plugins: review-flow@review-flow
          prompt: >-
            /review-flow:security --post
            --pr=${{ github.event.pull_request.number }}
            --base=${{ github.event.pull_request.base.sha }}
            --head=${{ github.event.pull_request.head.sha }}
            --since=${{ needs.prepare.outputs.since }}
          claude_args: >-
            --allowedTools "Agent,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api graphql:*),mcp__github_inline_comment__create_inline_comment"

      - name: Classify risk
        id: classify
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          plugin_marketplaces: https://github.com/__MARKETPLACE_REPO__.git
          plugins: review-flow@review-flow
          prompt: >-
            /review-flow:classify-risk
            --base=${{ github.event.pull_request.base.sha }}
            --head=${{ github.event.pull_request.head.sha }}
          claude_args: >-
            --allowedTools "Agent,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git merge-base:*)"
            --json-schema '{"type":"object","properties":{"tier":{"type":"string","enum":["low","medium","high"]},"human_required":{"type":"boolean"},"reasons":{"type":"array","items":{"type":"string"}}},"required":["tier","human_required","reasons"],"additionalProperties":false}'

  publish:
    needs: [prepare, review]
    if: ${{ !cancelled() && needs.review.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          CLASSIFICATION: ${{ needs.review.outputs.classification }}
          ROUND: ${{ needs.prepare.outputs.round }}
          CAPPED: ${{ needs.prepare.outputs.capped }}
        with:
          script: |
            const { publishClassification } = await import(`${process.env.GITHUB_WORKSPACE}/.github/review-flow/review-flow.mjs`);
            await publishClassification({ github, context, core });
